<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./signin.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/images/Netflix_Logo_PMS.png" alt="logo">
        </div>
    </header>
    <main>
        <form action="./browse.html">
            <h1>Enter your info to sign in</h1>
            <br>
            <h3><p>Or get started with a new account</p></h3>
            <input type="email" name="email" id="email" placeholder="Email or Mobile number">
            <button type="submit"><a href="./browse.html">Continue</a></button>
            <br><br>
            <select name="help" id="help" disabled>
                <option value="help">Get help</option>
            </select>
            <span><p>This page is protected by Google reCAPTCHA to ensure you're not a bot</p></span>
        </form>
    </main>
</body>
</html>
